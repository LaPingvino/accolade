Base = "bd" # Lexington's preset, as it is

# Accolade's buttons in the toolbar for this format (Lexington skips them):
# Insert goes in as a paragraph of its own ({n} numbers it, {N} in words,
# counting again after a line starting with Restart); Line = true puts it
# on the next line instead.
[Accolade]

  [[Accolade.Buttons]]
    Label = "Planche"
    Insert = "===\n\n.PLANCHE {n}"

  [[Accolade.Buttons]]
    Label = "Case"
    Insert = "Case {n}. "
    Restart = ".PLANCHE"

  [[Accolade.Buttons]]
    Label = "Récitatif"
    Insert = "RÉCITATIF\n"

  [[Accolade.Buttons]]
    Label = "Onomatopée"
    Insert = "ONOMATOPÉE\n"
