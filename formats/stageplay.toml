Base = "stageplay" # Lexington's preset, as it is

# Accolade's buttons in the toolbar for this format (Lexington skips them):
# Insert goes in as a paragraph of its own ({n} numbers it, {N} in words,
# counting again after a line starting with Restart); Line = true puts it
# on the next line instead.
[Accolade]

  [[Accolade.Buttons]]
    Label = "Scene"
    Insert = ".SCENE {n}"

  [[Accolade.Buttons]]
    Label = "Lights Up"
    Insert = "LIGHTS UP."

  [[Accolade.Buttons]]
    Label = "Blackout"
    Insert = "> BLACKOUT."

  [[Accolade.Buttons]]
    Label = "Curtain"
    Insert = "> CURTAIN."
