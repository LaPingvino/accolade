name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols poppler-utils

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -v ./...

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Screen reader build (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go vet -tags accessibility ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Test with the race detector (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
